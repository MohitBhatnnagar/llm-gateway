[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Provider-agnostic LLM gateway: OpenAI, Anthropic and Gemini adapters, routing, fallback, circuit breaker, caching and cost tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
llmgateway = "llmgateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
